<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>BACKROOMS - START</title><style>body{margin:0;background:#090806;color:#ddd;font:18px monospace;text-align:center}main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}a{display:block;width:280px;box-sizing:border-box;margin:10px;padding:18px;background:#17120c;color:#ddd;border:2px solid #777;text-decoration:none}a:focus,a:hover{outline:3px solid #fff;background:#34291a}h1{letter-spacing:4px;font-size:26px}.sub{opacity:.65;margin-bottom:20px}</style><main id="app"><h1>BACKROOMS</h1><div class="sub">CHOOSE DIFFICULTY</div><div id="choices"></div></main><script>(function(){var h=(location.hash||'').replace(/^#/,'').toLowerCase();var original=h==='level0-original'||h==='pool-original';var roblox=h==='level0-roblox';var m=h.match(/^(level0|pool)-(peaceful|horror)$/);var mode=m?m[1]:h.indexOf('pool-')===0?'pool':'level0';var play=m?m[2]:'horror';var box=document.getElementById('choices');function add(t,v){var a=document.createElement('a');a.href='tv-start.html#'+v;a.textContent=t;box.appendChild(a)}if(original){localStorage.setItem('backroomsStart',h);location.href='index.html';return}if(roblox){localStorage.setItem('backroomsStart',h);location.href='index.html';return}['easy','medium','hard'].forEach(function(d){add(d.toUpperCase(),'start-'+mode+'-'+play+'-'+d)});if(mode==='level0'){add('LEVEL 0 ORIGINAL MODE','start-level0-original');add('ROBLOX BACKROOMS','start-level0-roblox')}if(mode==='pool')add('POOL ROOMS ORIGINAL MODE','start-pool-original');add('BACK','pool'===mode?'tv-pool.html':'tv-level0.html');var links=box.querySelectorAll('a');for(var i=0;i<links.length;i++){links[i].onclick=function(e){var x=this.getAttribute('href').replace('#','');if(x.indexOf('start-')===0){e.preventDefault();localStorage.setItem('backroomsStart',x.slice(6));location.href='index.html'}}}})();</script>
