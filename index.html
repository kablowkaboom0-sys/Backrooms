<body>

<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const W=160,H=90,buf=document.createElement('canvas');buf.width=W;buf.height=H;
const g=buf.getContext('2d',{alpha:false}),img=g.createImageData(W,H),pix=img.data;
const FOV=Math.PI/3;
let MW=41,MH=41;
let seed=72631,map,exitCell,px,py,pa,startTime,finished=false,paused=false,sensitivity=.004;
let gameStarted=false;
let playerHealth=100,lastRegen=0;
let cluesEnabled=false;
let cluePath=[];
let cluePathCellX=-1,cluePathCellY=-1;
let entities=[];
let difficultySize=41;
let gameMode="level0";
let startCell={x:1,y:1};
let pz=0;
let poolRoomType=[];
let poolFloorHeight=[];
let poolWaterDepth=[];
const ENTITY_SPEED=1.075; // Easy mode: original entity speed (half the player's normal speed).
const ENTITY_DAMAGE=20;
const ENTITY_DAMAGE_COOLDOWN=1000;
const ENTITY_ATTACK_RANGE=.58;
let lastEntityThink=0;
const RENDER_DISTANCE=13.5;
const FOG_START=6.0;
const keys={};
const depthBuffer=new Float32Array(W);

function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function makeMap(){
 seed=72631;const m=Array.from({length:MH},()=>Array(MW).fill(1));
 function carve(x,y){
  m[y][x]=0;const d=[[2,0],[-2,0],[0,2],[0,-2]];
  for(let i=3;i>0;i--){const j=rnd()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
  for(const [dx,dy] of d){const X=x+dx,Y=y+dy;
   if(X>0&&X<MW-1&&Y>0&&Y<MH-1&&m[Y][X]){m[y+dy/2][x+dx/2]=0;carve(X,Y)}
  }
 }
 carve(1,1);return m;
}
function poolCellType(x,y){
 if(gameMode!=="pool"||!poolRoomType[y]||poolRoomType[y][x]===undefined)return 0;
 return poolRoomType[y][x];
}
function poolFloorAt(x,y){
 if(gameMode!=="pool"||!poolFloorHeight.length)return 0;
 const cx=Math.max(0,Math.min(MW-1,Math.floor(x))),cy=Math.max(0,Math.min(MH-1,Math.floor(y)));
 return poolFloorHeight[cy][cx]||0;
}
function poolWaterAt(x,y){
 if(gameMode!=="pool"||!poolWaterDepth.length)return 0;
 const cx=Math.max(0,Math.min(MW-1,Math.floor(x))),cy=Math.max(0,Math.min(MH-1,Math.floor(y)));
 return poolWaterDepth[cy][cx]||0;
}
function makePoolMap(){
 seed=193742;const m=Array.from({length:MH},()=>Array(MW).fill(1));
 poolRoomType=Array.from({length:MH},()=>Array(MW).fill(0));
 poolFloorHeight=Array.from({length:MH},()=>Array(MW).fill(0));
 poolWaterDepth=Array.from({length:MH},()=>Array(MW).fill(0));
 const rooms=[];
 const target=MW<=45?7:MW<=55?9:11;
 function overlaps(x,y,w,h){
  return rooms.some(r=>x<r.x+r.w+2&&x+w+2>r.x&&y<r.y+r.h+2&&y+h+2>r.y);
 }
 function carveRoom(room,type){
  for(let y=room.y;y<room.y+room.h;y++)for(let x=room.x;x<room.x+room.w;x++){
   m[y][x]=0;poolRoomType[y][x]=type;
   if(type===1)poolWaterDepth[y][x]=.16;
   if(type===2)poolWaterDepth[y][x]=.48;
  }
  if(type===5){
   const horizontal=room.w>=room.h;
   for(let y=room.y;y<room.y+room.h;y++)for(let x=room.x;x<room.x+room.w;x++){
    const t=horizontal?(x-room.x)/Math.max(1,room.w-1):(y-room.y)/Math.max(1,room.h-1);
    poolFloorHeight[y][x]=(t-.5)*1.25;
   }
  }
  if(type===3){
   for(let y=room.y+2;y<room.y+room.h-2;y+=4)for(let x=room.x+2;x<room.x+room.w-2;x+=4){
    if(rnd()>.22){
     for(let yy=y;yy<Math.min(y+2,room.y+room.h-1);yy++)for(let xx=x;xx<Math.min(x+2,room.x+room.w-1);xx++)m[yy][xx]=1;
    }
   }
  }
 }
 for(let tries=0;tries<500&&rooms.length<target;tries++){
  const w=(7+(rnd()*7|0))|1,h=(7+(rnd()*7|0))|1;
  const x=1+((rnd()*Math.max(1,MW-w-2))|0);const y=1+((rnd()*Math.max(1,MH-h-2))|0);
  if(x%2===0||y%2===0)continue;
  if(overlaps(x,y,w,h))continue;
  const type=[1,1,2,2,3,4,5,5][Math.floor(rnd()*8)];
  const room={x,y,w,h,type};rooms.push(room);carveRoom(room,type);
 }
 if(rooms.length<2){
  rooms.length=0;
  const fallback=[{x:3,y:3,w:11,h:9,type:1},{x:MW-16,y:MH-14,w:11,h:9,type:5}];
  for(const room of fallback){rooms.push(room);carveRoom(room,room.type)}
 }
 function carveCorridor(a,b){
  let x=a,y=a;
  // This overload is replaced below; kept only to keep corridor logic local.
 }
 // Connect every room to the nearest previous room with wide, non-maze corridors.
 for(let i=1;i<rooms.length;i++){
  const b=rooms[i];let best=rooms[0],bd=Infinity;
  for(let j=0;j<i;j++){const a=rooms[j];const d=Math.hypot((a.x+a.w/2)-(b.x+b.w/2),(a.y+a.h/2)-(b.y+b.h/2));if(d<bd){bd=d;best=a}}
  let x=Math.floor(best.x+best.w/2),y=Math.floor(best.y+best.h/2);
  const tx=Math.floor(b.x+b.w/2),ty=Math.floor(b.y+b.h/2);
  const horizontalFirst=rnd()<.5;
  const carve=(cx,cy)=>{for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){const xx=cx+ox,yy=cy+oy;if(xx>0&&yy>0&&xx<MW-1&&yy<MH-1){m[yy][xx]=0;if(poolRoomType[yy][xx]===0)poolRoomType[yy][xx]=4}}};
  if(horizontalFirst){while(x!==tx){carve(x,y);x+=Math.sign(tx-x)}while(y!==ty){carve(x,y);y+=Math.sign(ty-y)}}
  else{while(y!==ty){carve(x,y);y+=Math.sign(ty-y)}while(x!==tx){carve(x,y);x+=Math.sign(tx-x)}}
  carve(tx,ty);
 }
 // Start in the first chamber; exit will be selected by the normal farthest-cell search.
 startCell={x:Math.floor(rooms[0].x+rooms[0].w/2),y:Math.floor(rooms[0].y+rooms[0].h/2)};
 // Keep the starting tile clear even if it landed beside a pillar.
 m[startCell.y][startCell.x]=0;poolRoomType[startCell.y][startCell.x]=1;poolWaterDepth[startCell.y][startCell.x]=.08;
 return m;
}
function poolWallTexture(x,y){
 const type=poolCellType(x,y),n=texNoise(x,y);
 if(type===4)return [62+n*10,66+n*10,61+n*9];
 if(type===3)return [205+n*14,203+n*13,190+n*11];
 if(type===5)return [191+n*12,190+n*11,177+n*10];
 return [218+n*12,218+n*12,205+n*10];
}
function findExit(){
 const sx=startCell.x,sy=startCell.y;const d=Array.from({length:MH},()=>Array(MW).fill(-1)),q=[[sx,sy]];d[sy][sx]=0;let far=[sx,sy];
 for(let i=0;i<q.length;i++){const [x,y]=q[i];
  if(d[y][x]>d[far[1]][far[0]])far=[x,y];
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
   const X=x+dx,Y=y+dy;
   if(X>=0&&X<MW&&Y>=0&&Y<MH&&map[Y][X]===0&&d[Y][X]<0){d[Y][X]=d[y][x]+1;q.push([X,Y])}
  }
 }
 exitCell={x:far[0],y:far[1]};
}
function reset(){
 map=gameMode==="pool"?makePoolMap():makeMap();findExit();px=startCell.x+.5;py=startCell.y+.5;pa=0;pz=poolFloorAt(px,py);startTime=performance.now();
 cluesEnabled=false;cluePath=[];cluePathCellX=-1;cluePathCellY=-1;updateClueToggle();
 playerHealth=100;lastRegen=startTime;lastEntityThink=0;
 spawnEntities();

 finished=false;paused=false;document.getElementById('end').style.display='none';
 document.getElementById('end').querySelector('p:nth-of-type(2)').textContent='You found the way out.';
 updateHealthUI();
 document.getElementById('panel').style.display='none';clearKeys();
}
function clearKeys(){for(const k in keys)keys[k]=false}
function drawDevMap(){
 const mc=document.getElementById('mapCanvas'),mctx=mc.getContext('2d');
 const cs=mc.width/MW;
 mctx.clearRect(0,0,mc.width,mc.height);
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  if(map[y][x])mctx.fillStyle='#17120c';
  else mctx.fillStyle='#c7a95b';
  mctx.fillRect(x*cs,y*cs,cs,cs);
 }
 // Start marker.
 mctx.fillStyle='#4aa3ff';mctx.fillRect(startCell.x*cs+.2*cs,startCell.y*cs+.2*cs,.6*cs,.6*cs);
 // Exit marker.
 mctx.fillStyle='#fff';mctx.fillRect(exitCell.x*cs+.08*cs,exitCell.y*cs+.08*cs,.84*cs,.84*cs);
 // Player marker.
 const ptx=px*cs,pty=py*cs;
 mctx.fillStyle='#e33';mctx.beginPath();mctx.arc(ptx,pty,Math.max(3,cs*.35),0,Math.PI*2);mctx.fill();
 mctx.strokeStyle='#f66';mctx.lineWidth=2;mctx.beginPath();
 mctx.moveTo(ptx,pty);mctx.lineTo(ptx+Math.cos(pa)*cs*1.5,pty+Math.sin(pa)*cs*1.5);mctx.stroke();
 // Entity markers on the map.
 for(const e of entities){
  const ex=e.x*cs,ey=e.y*cs,er=Math.max(3,cs*.32);
  mctx.fillStyle='#050505';
  mctx.beginPath();mctx.arc(ex,ey,er,0,Math.PI*2);mctx.fill();
  mctx.strokeStyle='#eee';mctx.lineWidth=Math.max(1,cs*.08);mctx.stroke();
 }
 // Entity movement is animated while the map is open by using their live positions.
}

function entityCountForSize(size){
 if(difficultySize===21)return 1;
 if(difficultySize===31)return 4;
 return 6;
}
function spawnEntities(){
 entities=[];
 const count=entityCountForSize(MW);
 // Build a pool of valid corridor cells away from the player's start.
 const candidates=[];
 for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){
  if(map[y][x]===0 && Math.hypot(x+.5-(startCell.x+.5),y+.5-(startCell.y+.5))>6) candidates.push([x,y]);
 }
 if(!candidates.length)return;

 // Farthest-point sampling: each new entity is placed as far as possible
 // from all already chosen entities. This prevents clustered spawns and
 // spreads them across different parts of the maze.
 const chosen=[];
 let first=Math.floor(rnd()*candidates.length);
 chosen.push(candidates[first]);
 for(let i=1;i<count;i++){
  let best=null,bestScore=-1;
  for(const candidate of candidates){
   if(chosen.some(p=>p[0]===candidate[0]&&p[1]===candidate[1]))continue;
   let nearest=Infinity;
   for(const p of chosen){
    const d=Math.hypot(candidate[0]-p[0],candidate[1]-p[1]);
    if(d<nearest)nearest=d;
   }
   if(nearest>bestScore){bestScore=nearest;best=candidate;}
  }
  if(best)chosen.push(best);
 }
 for(let i=0;i<chosen.length;i++){
  const pick=chosen[i];
  entities.push({
   x:pick[0]+.5,y:pick[1]+.5,
   path:[],nextThink:0,lastHit:0,
   phase:i*.9
  });
 }
}
function findEntityPath(ex,ey){
 const sx=Math.floor(ex),sy=Math.floor(ey),tx=Math.floor(px),ty=Math.floor(py);
 if(sx===tx&&sy===ty)return [];
 const seen=Array.from({length:MH},()=>Array(MW).fill(false));
 const prev=Array.from({length:MH},()=>Array(MW).fill(null));
 const q=[[sx,sy]];seen[sy][sx]=true;
 for(let i=0;i<q.length;i++){
  const [x,y]=q[i];
  if(x===tx&&y===ty)break;
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
   const X=x+dx,Y=y+dy;
   if(X>=0&&X<MW&&Y>=0&&Y<MH&&!seen[Y][X]&&map[Y][X]===0){
    seen[Y][X]=true;prev[Y][X]=[x,y];q.push([X,Y]);
   }
  }
 }
 if(!seen[ty][tx])return [];
 const path=[];let cur=[tx,ty];
 while(cur[0]!==sx||cur[1]!==sy){
  path.push(cur);cur=prev[cur[1]][cur[0]];
  if(!cur)break;
 }
 path.reverse();return path;
}
function updateEntities(now,dt){
 if(!gameStarted||paused||finished)return;
 if(now-lastEntityThink>350){
  lastEntityThink=now;
  for(const e of entities)e.path=findEntityPath(e.x,e.y);
 }
 for(const e of entities){
  const dx=px-e.x,dy=py-e.y,dist=Math.hypot(dx,dy);
  if(dist>ENTITY_ATTACK_RANGE){
   let tx=px,ty=py;
   if(e.path.length){
    tx=e.path[0][0]+.5;ty=e.path[0][1]+.5;
    if(Math.hypot(tx-e.x,ty-e.y)<.18)e.path.shift();
   }
   const vx=tx-e.x,vy=ty-e.y,len=Math.hypot(vx,vy)||1;
   // Medium is 15% faster and Hard is 25% faster than the original speed.
   // Always cap the entity at the player's current movement speed.
   const speedMultiplier=MW===31?1.15:MW===41?1.25:1;
   const playerSpeed=2.15*(keys.shift?1.55:1);
   const entitySpeed=Math.min(ENTITY_SPEED*speedMultiplier,playerSpeed);
   const step=Math.min(entitySpeed*dt,len);
   const nx=e.x+vx/len*step,ny=e.y+vy/len*step;
   if(!wall(Math.floor(nx),Math.floor(e.y)) && Math.hypot(nx-px,e.y-py)>.32)e.x=nx;
   if(!wall(Math.floor(e.x),Math.floor(ny)) && Math.hypot(e.x-px,ny-py)>.32)e.y=ny;
  }else if(now-e.lastHit>=ENTITY_DAMAGE_COOLDOWN){
   e.lastHit=now;
   playerHealth=Math.max(0,playerHealth-ENTITY_DAMAGE);
   updateHealthUI();
   if(playerHealth<=0)playerDown();
  }
 }
}
function playerDown(){
 finished=true;clearKeys();
 document.getElementById('finalTime').textContent='YOU WERE CAUGHT — TIME: '+fmt((performance.now()-startTime)/1000);
 document.getElementById('end').querySelector('p:nth-of-type(2)').textContent='The entity caught you.';
 document.getElementById('end').style.display='flex';
}
function updateHealthUI(){
 const fill=document.getElementById('healthFill');
 const text=document.getElementById('healthText');
 fill.style.width=playerHealth+'%';
 text.textContent=Math.ceil(playerHealth)+' / 100';
}
function regenHealth(now){
 if(playerHealth>=100)return;
 if(now-lastRegen>=5000){
  const ticks=Math.floor((now-lastRegen)/5000);
  playerHealth=Math.min(100,playerHealth+ticks);
  lastRegen+=ticks*5000;
  updateHealthUI();
 }
}

function wall(x,y){return x<0||y<0||x>=MW||y>=MH||map[y][x]===1}
function startGame(size){
 MW=gameMode==="pool"?(size===21?45:size===31?55:65):size;
 MH=MW;difficultySize=size;
 startCell=gameMode==="pool"?{x:1,y:1}:{x:1,y:1};gameStarted=true;
 document.getElementById('startScreen').style.display='none';
 document.getElementById('title').textContent=gameMode==="pool"?"BACKROOMS // POOL ROOMS":"BACKROOMS // LEVEL 0";
 reset();
}
function atExit(x,y){return x===exitCell.x&&y===exitCell.y}
function move(dt){
 if(paused||finished)return;
 let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
 let s=(keys.d?1:0)-(keys.a?1:0);
 if(keys.q||keys.arrowleft)pa-=dt*1.8;
 if(keys.e||keys.arrowright)pa+=dt*1.8;
 const sp=2.15*(keys.shift?1.55:1),ca=Math.cos(pa),sa=Math.sin(pa);
 const dx=(ca*f-sa*s)*sp*dt,dy=(sa*f+ca*s)*sp*dt,r=.2;
 if(!wall(Math.floor(px+dx+r*Math.sign(dx)),Math.floor(py)))px+=dx;
 if(!wall(Math.floor(px),Math.floor(py+dy+r*Math.sign(dy))))py+=dy;
 if(gameMode==="pool"){const targetFloor=poolFloorAt(px,py);pz=0}
 if(atExit(Math.floor(px),Math.floor(py)))finish();
}
function finish(){
 finished=true;document.getElementById('finalTime').textContent='TIME: '+fmt((performance.now()-startTime)/1000);
 document.getElementById('end').style.display='flex';clearKeys();
}
function devToExit(){
 if(finished)return;
 const ex=exitCell.x+.5,ey=exitCell.y+.5;
 const vx=ex-px,vy=ey-py,len=Math.hypot(vx,vy)||1;
 // Place the player in the corridor just outside the exit cell, facing the door.
 const stand=0.72;
 px=ex-(vx/len)*stand;
 py=ey-(vy/len)*stand;
 // If that position is blocked, use the opposite side of the exit.
 if(wall(Math.floor(px),Math.floor(py))){
  px=ex+(vx/len)*stand;
  py=ey+(vy/len)*stand;
 }
 pa=Math.atan2(ey-py,ex-px);
 clearKeys();
}
function fmt(t){const m=t/60|0,s=t%60|0,d=t*10%10|0;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+d}
function hash(x,y){let n=((x*374761393+y*668265263)>>>0);n=(n^(n>>13))*1274126177>>>0;n^=n>>16;return (n>>>0)/4294967296}
function texNoise(x,y){return hash(Math.floor(x*8),Math.floor(y*8))-.5}
function wallTexture(x,y){
 const n=texNoise(x,y);
 const seam=(Math.floor(y*2)%2===0)?-4:0;
 return [Math.max(0,178+n*18+seam),Math.max(0,151+n*16+seam),Math.max(0,76+n*10+seam)];
}
function carpetTexture(x,y){
 // Fine, irregular carpet fibers: individual low-res pixels rather than large repeating blocks.
 const gx=Math.floor(x*38),gy=Math.floor(y*38);
 const n=hash(gx,gy)-.5;
 const n2=hash(gx*7+19,gy*11+5)-.5;
 const strand=hash(gx*13+3,gy*17+9);
 let fiber=n*20+n2*10;
 // Sparse brighter/darker strands make the surface read as soft, furry carpet.
 if(strand>.88)fiber+=18;
 else if(strand<.10)fiber-=14;
 // A few isolated pixel flecks break up any regularity.
 const fleck=hash(Math.floor(x*92)+31,Math.floor(y*92)+47);
 if(fleck>.965)fiber+=24;
 if(fleck<.025)fiber-=18;
 return [
  Math.max(0,108+fiber),
  Math.max(0,21+fiber*.24),
  Math.max(0,20+fiber*.20)
 ];
}
function ceilingTexture(x,y){
 const n=texNoise(x,y);
 const tile=((Math.floor(x*3)+Math.floor(y*3))&1)?3:-3;
 return [Math.max(0,178+n*18+tile),Math.max(0,151+n*16+tile),Math.max(0,76+n*10+tile)];
}
function setPix(i,r,g,b){
 r=Number.isFinite(r)?r:60;g=Number.isFinite(g)?g:45;b=Number.isFinite(b)?b:25;
 pix[i]=Math.max(0,Math.min(255,r));pix[i+1]=Math.max(0,Math.min(255,g));pix[i+2]=Math.max(0,Math.min(255,b));pix[i+3]=255
}

function findCluePath(){
 const sx=Math.floor(px),sy=Math.floor(py),tx=exitCell.x,ty=exitCell.y;
 if(sx===tx&&sy===ty)return [];
 const seen=Array.from({length:MH},()=>Array(MW).fill(false));
 const prev=Array.from({length:MH},()=>Array(MW).fill(null));
 const q=[[sx,sy]];seen[sy][sx]=true;
 for(let i=0;i<q.length;i++){
  const [x,y]=q[i];
  if(x===tx&&y===ty)break;
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
   const X=x+dx,Y=y+dy;
   if(X>=0&&X<MW&&Y>=0&&Y<MH&&!seen[Y][X]&&map[Y][X]===0){
    seen[Y][X]=true;prev[Y][X]=[x,y];q.push([X,Y]);
   }
  }
 }
 if(!seen[ty][tx])return [];
 const path=[];let cur=[tx,ty];
 while(cur[0]!==sx||cur[1]!==sy){
  path.push(cur);cur=prev[cur[1]][cur[0]];
  if(!cur)break;
 }
 path.reverse();
 return path;
}

function getCluePath(){
 const cx=Math.floor(px),cy=Math.floor(py);
 if(cx!==cluePathCellX||cy!==cluePathCellY){
  cluePath=findCluePath();
  cluePathCellX=cx;cluePathCellY=cy;
 }
 return cluePath;
}

function drawWallArrow(wx,wy,dx,dy){
 const vx=wx-px,vy=wy-py,dist=Math.hypot(vx,vy);
 if(dist<.7||dist>RENDER_DISTANCE)return;
 let da=Math.atan2(vy,vx)-pa;
 while(da>Math.PI)da-=Math.PI*2;
 while(da<-Math.PI)da+=Math.PI*2;
 if(Math.abs(da)>FOV*.68)return;

 const sx=W/2+(Math.tan(da)/Math.tan(FOV/2))*(W/2);
 const ix=Math.round(sx);
 if(ix<0||ix>=W||dist>depthBuffer[ix]+.28)return;

 const forward=dx*Math.cos(pa)+dy*Math.sin(pa);
 const right=dx*(-Math.sin(pa))+dy*Math.cos(pa);
 const angle=Math.atan2(-forward,right);
 const size=Math.max(3,Math.min(10,H/(dist*2.7)));
 const cx=sx,cy=H*.48;

 g.save();
 g.translate(cx,cy);
 g.rotate(angle);
 g.fillStyle='rgba(245,235,180,.92)';
 g.beginPath();
 g.moveTo(size*1.15,0);
 g.lineTo(size*.25,-size*.62);
 g.lineTo(size*.25,-size*.22);
 g.lineTo(-size*.9,-size*.22);
 g.lineTo(-size*.9,size*.22);
 g.lineTo(size*.25,size*.22);
 g.lineTo(size*.25,size*.62);
 g.closePath();
 g.fill();
 g.restore();
}

function drawClueArrows(){
 if(!cluesEnabled||!map||finished)return;
 const path=getCluePath();
 if(!path.length)return;

 // Put arrows on nearby walls along the real shortest route to the exit.
 // They update as the player enters new maze cells, so they always point onward.
 const samples=[];
 let lastIndex=-99;
 for(let i=0;i<path.length-1;i++){
  const [x,y]=path[i], [nx,ny]=path[i+1];
  const turn=i===0 || (path[i][0]-path[i-1][0]!==nx-x || path[i][1]-path[i-1][1]!==ny-y);
  if(turn || i-lastIndex>=3 || i===path.length-2){
   samples.push(i);lastIndex=i;
  }
 }
 for(const i of samples){
  const [x,y]=path[i], [nx,ny]=path[i+1];
  const dirX=nx-x,dirY=ny-y;
  const walls=[];
  if(wall(x,y-1))walls.push([x+.5,y+.015]);
  if(wall(x,y+1))walls.push([x+.5,y+.985]);
  if(wall(x-1,y))walls.push([x+.015,y+.5]);
  if(wall(x+1,y))walls.push([x+.985,y+.5]);
  if(!walls.length)continue;

  // Prefer a side wall perpendicular to the route so the arrow is clearly visible.
  let pick=walls[0];
  if(Math.abs(dirX)>Math.abs(dirY)){
   pick=walls.find(p=>Math.abs(p[1]-(y+.5))>.4)||walls[0];
  }else{
   pick=walls.find(p=>Math.abs(p[0]-(x+.5))>.4)||walls[0];
  }
  drawWallArrow(pick[0],pick[1],dirX,dirY);
 }
}

function entitySilhouette(gx,gy,scale){
 // Pixel-art silhouette based on the supplied entity reference:
 // large irregular head, thin long body/legs, narrow arms.
 const unit=Math.max(1,Math.floor(scale/12));
 const rect=(x,y,w,h)=>g.fillRect(Math.round(gx+x*unit),Math.round(gy+y*unit),Math.max(1,w*unit),Math.max(1,h*unit));
 rect(4,0,3,1);rect(3,1,5,2);rect(2,3,6,2);rect(3,5,5,2);
 rect(4,7,3,5); // torso
 rect(3,8,1,5);rect(7,8,1,5); // arms
 rect(4,12,1,8);rect(6,12,1,8); // legs
 rect(2,13,1,4);rect(8,13,1,4); // hanging arms
}
function drawEntities(){
 for(const e of entities){
  const dx=e.x-px,dy=e.y-py,dist=Math.hypot(dx,dy);
  if(dist>.2&&dist>RENDER_DISTANCE)continue;
  let da=Math.atan2(dy,dx)-pa;
  while(da>Math.PI)da-=Math.PI*2;
  while(da<-Math.PI)da+=Math.PI*2;
  if(Math.abs(da)>FOV*.62)continue;
  const center=W/2+(Math.tan(da)/Math.tan(FOV/2))*(W/2);
  const h=Math.min(H*1.7,H/(Math.max(.35,dist))*.82);
  const unit=Math.max(1,Math.floor(h/21));
  const width=10*unit;
  const left=Math.round(center-width/2),top=Math.round(H/2-h*.47);
  // Simple column occlusion against the wall depth.
  let visible=false;
  for(let sx=Math.max(0,left);sx<Math.min(W,left+width);sx++){
   if(dist<depthBuffer[sx]){visible=true;break}
  }
  if(!visible)continue;
  g.fillStyle='#090909';
  entitySilhouette(left,top,h);
  // Subtle light edge so the silhouette remains visible in dark rooms.
  g.fillStyle='rgba(35,35,30,.8)';
  const eyeY=top+Math.max(1,unit*6);
  g.fillRect(Math.round(center-unit),Math.round(eyeY),Math.max(1,unit),Math.max(1,unit));
  g.fillRect(Math.round(center+unit),Math.round(eyeY),Math.max(1,unit),Math.max(1,unit));
 }
}

function drawEntityGlitch(now){
 const closest=entities.reduce((best,e)=>Math.min(best,Math.hypot(e.x-px,e.y-py)),Infinity);
 const range=1.35;
 if(!Number.isFinite(closest)||closest>=range||finished)return;
 // The closer the entity, the stronger and more frequent the interference.
 const intensity=Math.max(0,1-closest/range);
 const pulse=Math.sin(now*.035)+Math.sin(now*.071)*.55;
 const chance=0.08+intensity*.24;
 if((pulse>-.25 && Math.random()<chance)||intensity>.82){
  const bands=Math.max(1,Math.floor(1+intensity*5));
  for(let i=0;i<bands;i++){
   const y=Math.floor(Math.random()*H);
   const h=Math.max(1,Math.floor(1+Math.random()*(1+intensity*3)));
   const shift=Math.floor((Math.random()-.5)*(4+intensity*16));
   g.drawImage(buf,0,y,W,h,shift,y,W,h);
   g.fillStyle='rgba(235,225,185,'+(0.05+intensity*.10)+')';
   g.fillRect(Math.random()*W,y,Math.max(2,Math.random()*W*.35),h);
  }
 }
 if(intensity>.58){
  g.fillStyle='rgba(210,205,170,'+(0.025+intensity*.045)+')';
  for(let i=0;i<Math.floor(intensity*12);i++){
   g.fillRect(Math.random()*W,Math.random()*H,1+Math.random()*3,1+Math.random()*2);
  }
 }
}

function render(){
 // Always paint a visible fallback first. This prevents a failed frame from leaving a blank canvas.
 ctx.fillStyle='#3b2f20';
 ctx.fillRect(0,0,canvas.width,canvas.height);
 if(!gameStarted||!map)return;

 const hz=H*.51;

 // Fast world-space ceiling/floor. Keep the low-resolution pixel style, but avoid
 // expensive calculations for every screen pixel.
 for(let y=0;y<H;y++){
  const horizon=y<hz;
  const row=Math.abs(y-hz)+1;
  const depth=Math.min(RENDER_DISTANCE,18/row);
  const fade=horizon?Math.max(.42,1-depth*.025):Math.max(.30,1-depth*.018);
  const fog=Math.max(.58,1-Math.max(0,depth-FOG_START)/(RENDER_DISTANCE-FOG_START)*.32);
  const base=horizon?178:108;
  const rr=base*fade*fog;
  const gg=(horizon?151:21)*fade*fog;
  const bb=(horizon?76:20)*fade*fog;
  for(let x=0;x<W;x++)setPix((y*W+x)*4,rr,gg,bb);
 }

 // Raycast one column at a time.
 for(let x=0;x<W;x++){
  depthBuffer[x]=RENDER_DISTANCE+1;
  const cam=(x/W-.5)*2;
  const ra=pa+Math.atan(cam*Math.tan(FOV/2));
  const rx=Math.cos(ra),ry=Math.sin(ra);
  let mx=Math.floor(px),my=Math.floor(py),side=0,hitExit=false,dist=RENDER_DISTANCE+1;
  const ddx=Math.abs(1/(rx||1e-9)),ddy=Math.abs(1/(ry||1e-9));
  const sx=rx<0?-1:1,sy=ry<0?-1:1;
  let sdx=rx<0?(px-mx)*ddx:(mx+1-px)*ddx;
  let sdy=ry<0?(py-my)*ddy:(my+1-py)*ddy;

  for(let i=0;i<80;i++){
   if(sdx<sdy){dist=sdx;sdx+=ddx;mx+=sx;side=0}
   else{dist=sdy;sdy+=ddy;my+=sy;side=1}
   if(wall(mx,my))break;
   if(atExit(mx,my)){hitExit=true;break}
  }

  if(hitExit){
   const ex=exitCell.x+.5-px,ey=exitCell.y+.5-py;
   dist=Math.max(.05,ex*rx+ey*ry);
  }
  dist=Math.max(.05,dist*Math.cos(ra-pa));
  depthBuffer[x]=dist;

  if(dist>RENDER_DISTANCE){
   continue;
  }

  const line=Math.min(H*2,H/dist*.92);
  const top=Math.max(0,((H-line)/2)|0);
  const bottom=Math.min(H,((H+line)/2)|0);
  const shade=Math.max(20,78-dist*4)*(side?.84:1);
  const fog=Math.max(.62,1-Math.max(0,dist-FOG_START)/(RENDER_DISTANCE-FOG_START)*.28);

  for(let y=top;y<bottom;y++){
   let r,gc,b;
   if(hitExit){
    const ex=exitCell.x+.5,ey=exitCell.y+.5;
    let da=Math.atan2(ey-py,ex-px)-pa;
    while(da>Math.PI)da-=Math.PI*2;
    while(da<-Math.PI)da+=Math.PI*2;
    const doorCenter=W/2+(Math.tan(da)/Math.tan(FOV/2))*(W/2);
    const doorHalf=Math.max(2,line*.30);
    const edge=Math.abs(x-doorCenter)/doorHalf;
    if(edge<1 && y>top+line*.06 && y<top+line*.97){
     const pulse=.9+.1*Math.sin(performance.now()*.006);
     r=245*pulse;gc=245*pulse;b=238*pulse;
    }else{
     const v=52+(1-edge)*55;
     r=v+10;gc=v+8;b=v+3;
    }
   }else{
    const wt=wallTexture(mx+(side?0.5:0),my+(side?0:0.5));
    const stripe=((x*13+y*7)&7);
    const pixelNoise=(stripe===0?10:stripe===7?-7:0);
    const light=Math.max(.30,Math.min(1,shade/78));
    r=(wt[0]+pixelNoise)*light*fog;
    gc=(wt[1]+pixelNoise*.7)*light*fog;
    b=(wt[2]+pixelNoise*.4)*light*fog;
   }
   setPix((y*W+x)*4,r,gc,b);
  }
 }

 // Same floor renderer as Level 0.
 for(let y=Math.max(0,Math.floor(hz)+1);y<H;y++){
  const row=(y-hz)/H;
  const fiberScale=10+Math.floor(row*45);
  for(let x=0;x<W;x++){
   const i=(y*W+x)*4;
   const n=hash(x+fiberScale*17,y+fiberScale*31)-.5;
   const fiber=n*18;
   pix[i]=Math.max(0,Math.min(255,pix[i]+fiber));
   pix[i+1]=Math.max(0,Math.min(255,pix[i+1]+fiber*.20));
   pix[i+2]=Math.max(0,Math.min(255,pix[i+2]+fiber*.18));
  }
 }

 g.putImageData(img,0,0);
 drawClueArrows();
 drawEntities();
 drawEntityGlitch(performance.now());
 ctx.imageSmoothingEnabled=false;
 ctx.drawImage(buf,0,0,canvas.width,canvas.height);
}


addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(k==='escape'||k==='p'){togglePause();return}
 if(k==='m'){const panel=document.getElementById('mapPanel');if(panel.style.display==='flex')closeMap();else openMap();return}
 keys[k]=true;
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let drag=false,lastX=0;
canvas.onpointerdown=e=>{if(paused||finished)return;drag=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)};
canvas.onpointerup=()=>drag=false;canvas.onpointercancel=()=>drag=false;
canvas.onpointermove=e=>{if(drag&&!paused){pa+=(e.clientX-lastX)*sensitivity;lastX=e.clientX}};

function joystick(el,knob,callback){
 let active=false,id=null,cx=0,cy=0;
 function update(x,y){let dx=x-cx,dy=y-cy,len=Math.hypot(dx,dy),max=42;if(len>max){dx*=max/len;dy*=max/len}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';callback(dx/max,dy/max);
 }
 el.addEventListener('pointerdown',e=>{e.preventDefault();active=true;id=e.pointerId;const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;el.setPointerCapture(id);update(e.clientX,e.clientY)});
 el.addEventListener('pointermove',e=>{if(active&&e.pointerId===id)update(e.clientX,e.clientY)});
 function end(){active=false;knob.style.transform='translate(0,0)';callback(0,0)}
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
joystick(document.getElementById('moveStick'),document.querySelector('#moveStick .knob'),(x,y)=>{
 keys.w=y<-.18;keys.s=y>.18;keys.a=x<-.18;keys.d=x>.18;
});
joystick(document.getElementById('lookStick'),document.querySelector('#lookStick .knob'),(x)=>{if(!paused&&!finished)pa+=x*.035});
const run=document.getElementById('run');
run.onpointerdown=e=>{e.preventDefault();keys.shift=true};run.onpointerup=run.onpointercancel=()=>keys.shift=false;

function updateClueToggle(){
 const b=document.getElementById('clueToggle');
 if(!b)return;
 b.textContent=cluesEnabled?'ON':'OFF';
 b.classList.toggle('on',cluesEnabled);
 b.setAttribute('aria-pressed',String(cluesEnabled));
}
function toggleClues(){
 if(finished)return;
 cluesEnabled=!cluesEnabled;
 cluePath=[];
 cluePathCellX=-1;cluePathCellY=-1;
 updateClueToggle();
}
function togglePause(){if(finished)return;paused=!paused;clearKeys();document.getElementById('panel').style.display=paused?'flex':'none';updateClueToggle()}
function openMap(){
 if(finished)return;
 clearKeys();
 drawDevMap();
 document.getElementById('mapPanel').style.display='flex';
}
function closeMap(){document.getElementById('mapPanel').style.display='none'}
document.querySelectorAll('.mode').forEach(btn=>btn.onclick=()=>{
 gameMode=btn.dataset.mode;
 document.getElementById('modeChoices').style.display='none';
 document.getElementById('difficultyChoices').style.display='flex';
 document.getElementById('startSub').textContent=gameMode==="pool"?'POOL ROOMS // CHOOSE DIFFICULTY':'LEVEL 0 // CHOOSE DIFFICULTY';
});
document.getElementById('backModes').onclick=()=>{
 document.getElementById('difficultyChoices').style.display='none';
 document.getElementById('modeChoices').style.display='flex';
 document.getElementById('startSub').textContent='CHOOSE A LEVEL';
};
document.getElementById('pauseBtn').onclick=togglePause;
document.getElementById('devBtn').onclick=devToExit;
document.getElementById('mapBtn').onclick=openMap;
document.getElementById('mapClose').onclick=closeMap;
document.getElementById('resume').onclick=togglePause;
document.getElementById('clueToggle').onclick=toggleClues;
document.getElementById('retry').onclick=()=>{
 document.getElementById('end').style.display='none';
 document.getElementById('startScreen').style.display='flex';
 document.getElementById('difficultyChoices').style.display='none';
 document.getElementById('modeChoices').style.display='flex';
 document.getElementById('startSub').textContent='CHOOSE A LEVEL';
 gameStarted=false;finished=false;clearKeys();
};
updateClueToggle();
document.getElementById('sens').oninput=e=>{sensitivity=+e.target.value*.01;document.getElementById('sensVal').textContent=e.target.value};

let last=performance.now(),acc=0;
document.querySelectorAll('.diff').forEach(btn=>btn.onclick=()=>startGame(+btn.dataset.size));

function loop(now){
 const dt=Math.min(.1,(now-last)/1000);last=now;acc+=dt;
 if(acc>=1/30){
  acc-=1/30;
  try{
   move(1/30);
   const simNow=performance.now();
   updateEntities(simNow,1/30);
   if(document.getElementById('mapPanel').style.display==='flex') drawDevMap();
   regenHealth(simNow);
   render();
  }catch(err){
   console.error('Backrooms render error:',err);
   ctx.fillStyle='#5a4525';
   ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  if(!paused&&!finished)document.getElementById('timer').textContent=fmt((now-startTime)/1000)
}
 requestAnimationFrame(loop);
}
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
addEventListener('resize',resize);resize();requestAnimationFrame(loop);
</script>
